<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админ-панель — 100FF VL</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f5f5; --card: #fff; --border: #e0e0e0;
      --text: #1a1a1a; --hint: #888; --accent: #2AABEE;
      --danger: #e53935; --success: #43a047; --warn: #fb8c00;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Login ── */
    #login-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
    .login-card { background:var(--card); border-radius:16px; padding:40px 32px;
                  width:100%; max-width:360px; box-shadow:0 4px 24px rgba(0,0,0,.08); }
    .login-title { font-size:22px; font-weight:700; margin-bottom:8px; }
    .login-sub   { color:var(--hint); font-size:14px; margin-bottom:28px; }
    .login-card input { width:100%; padding:12px 14px; border:1.5px solid var(--border);
      border-radius:10px; font-size:16px; outline:none; margin-bottom:12px; }
    .login-card input:focus { border-color:var(--accent); }
    .login-error { color:var(--danger); font-size:13px; margin-bottom:12px; display:none; }

    /* ── App ── */
    #app-screen { display:none; }
    header { background:var(--card); border-bottom:1px solid var(--border);
             padding:0 24px; display:flex; align-items:center;
             gap:16px; height:56px; position:sticky; top:0; z-index:100; }
    .header-logo { font-weight:700; font-size:16px; margin-right:auto; }
    nav { display:flex; gap:4px; }
    .nav-btn { padding:6px 13px; border-radius:8px; border:none; cursor:pointer;
               font-size:13px; font-weight:500; background:none; color:var(--hint); }
    .nav-btn.active { background:var(--accent); color:#fff; }
    .logout-btn { padding:6px 14px; border-radius:8px; border:1.5px solid var(--border);
                  background:none; cursor:pointer; font-size:13px; color:var(--hint); white-space:nowrap; }
    .logout-btn:hover { border-color:var(--danger); color:var(--danger); }
    main { padding:24px; max-width:1100px; margin:0 auto; }
    .tab-content { display:none; }
    .tab-content.active { display:block; }

    /* ── Cards (orders/samples) ── */
    .card { background:var(--card); border-radius:12px; padding:20px;
            margin-bottom:16px; border:1px solid var(--border); transition:opacity .2s; }
    .card.processed-card { opacity:.5; }
    .card-header { display:flex; align-items:flex-start; justify-content:space-between;
                   gap:12px; margin-bottom:12px; flex-wrap:wrap; }
    .card-num  { font-weight:700; font-size:16px; }
    .card-date { color:var(--hint); font-size:13px; margin-top:2px; }
    .card-user { font-size:14px; margin-bottom:4px; }
    .card-phone { color:var(--hint); font-size:13px; }
    .badge { display:inline-block; padding:3px 10px; border-radius:20px;
             font-size:12px; font-weight:600; white-space:nowrap; }
    .badge-ok   { background:#e8f5e9; color:var(--success); }
    .badge-warn { background:#fff3e0; color:var(--warn); }
    .badge-done { background:#eeeeee; color:#999; }
    .items-table { width:100%; border-collapse:collapse; margin:12px 0; }
    .items-table th, .items-table td { text-align:left; padding:6px 10px;
      font-size:13px; border-bottom:1px solid var(--border); }
    .items-table th { color:var(--hint); font-weight:500; }
    .price-type-cut  { color:var(--warn); font-size:11px; }
    .price-type-base { color:var(--success); font-size:11px; }
    .card-total { font-weight:700; font-size:15px; text-align:right; }
    .card-comment { font-size:13px; color:var(--hint); margin-top:8px;
                    padding-top:8px; border-top:1px solid var(--border); }
    .card-footer { display:flex; justify-content:flex-end; margin-top:12px;
                   padding-top:12px; border-top:1px solid var(--border); }

    /* ── Fabrics table ── */
    /* overflow:clip — клипает скруглённые углы, но НЕ ломает position:sticky внутри */
    .fabrics-wrap { background:var(--card); border-radius:12px;
                    border:1px solid var(--border); overflow:clip; }
    table.ft { width:100%; border-collapse:collapse; }
    table.ft th, table.ft td { text-align:left; padding:10px 14px;
      font-size:13px; border-bottom:1px solid var(--border); }
    table.ft th { color:var(--hint); font-weight:500; background:var(--bg); }
    table.ft tr:last-child td { border-bottom:none; }
    table.ft tr.hidden-row td { opacity:.45; }

    /* ── Sticky toolbar каталога: поиск всегда виден при прокрутке ── */
    #tab-fabrics .toolbar {
      position: sticky;
      top: 56px;        /* высота главного header */
      z-index: 20;
      background: var(--bg);
      padding: 16px 0;
      margin-bottom: 4px;
    }
    table.ft tr:hover td { background:#fafafa; cursor:pointer; }
    .price-tag { font-size:12px; color:var(--hint); }

    /* ── Stats ── */
    .stats { display:flex; gap:16px; margin-bottom:24px; flex-wrap:wrap; }
    .stat-card { background:var(--card); border:1px solid var(--border);
                 border-radius:12px; padding:16px 20px; flex:1; min-width:140px; }
    .stat-val   { font-size:28px; font-weight:700; }
    .stat-label { color:var(--hint); font-size:13px; margin-top:2px; }

    /* ── Toolbar ── */
    .toolbar { display:flex; gap:12px; margin-bottom:20px; align-items:center; flex-wrap:wrap; }
    .toolbar input[type=text] { flex:1; min-width:160px; padding:10px 14px;
      border:1.5px solid var(--border); border-radius:10px; font-size:14px; outline:none; }
    .toolbar input[type=text]:focus { border-color:var(--accent); }
    .toolbar label { display:flex; align-items:center; gap:6px; font-size:13px;
                     color:var(--hint); cursor:pointer; white-space:nowrap; }

    /* ── Buttons ── */
    .btn { padding:10px 20px; border-radius:10px; border:none; cursor:pointer;
           font-size:14px; font-weight:600; }
    .btn-primary { background:var(--accent); color:#fff; }
    .btn-danger  { background:var(--danger); color:#fff; }
    .btn-success { background:var(--success); color:#fff; }
    .btn-ghost   { background:none; border:1.5px solid var(--border); color:var(--hint); }
    .btn:disabled { opacity:.5; cursor:default; }
    .btn-sm { padding:6px 14px; font-size:12px; border-radius:7px; }

    /* ═══════════════════════════════════════════
       МОДАЛЬНЫЙ РЕДАКТОР КАРТОЧКИ
    ═══════════════════════════════════════════ */
    .modal-overlay {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,.5);
      z-index:200; overflow-y:auto; padding:20px;
    }
    .modal-overlay.open { display:flex; align-items:flex-start; justify-content:center; }
    .modal {
      background:var(--card); border-radius:16px; width:100%; max-width:660px;
      padding:0; overflow:hidden; margin:auto; box-shadow:0 8px 40px rgba(0,0,0,.2);
    }
    .modal-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:18px 24px; border-bottom:1px solid var(--border);
      position:sticky; top:0; background:var(--card); z-index:10;
    }
    .modal-title { font-size:17px; font-weight:700; }
    .modal-close { background:none; border:none; font-size:22px; cursor:pointer;
                   color:var(--hint); line-height:1; padding:4px; }
    .modal-close:hover { color:var(--text); }
    .modal-body  { padding:24px; }
    .modal-footer { padding:16px 24px; border-top:1px solid var(--border);
                    display:flex; gap:12px; justify-content:flex-end; }

    /* ── Form fields ── */
    .form-section { margin-bottom:28px; }
    .form-section-title {
      font-size:13px; font-weight:600; text-transform:uppercase;
      letter-spacing:.05em; color:var(--hint); margin-bottom:14px;
    }
    .field-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .field-grid.cols-3 { grid-template-columns:1fr 1fr 1fr; }
    .field-full { grid-column:1/-1; }
    .field-label { font-size:12px; color:var(--hint); margin-bottom:5px; }
    .field input, .field textarea, .field select {
      width:100%; padding:9px 12px; border:1.5px solid var(--border);
      border-radius:9px; font-size:14px; outline:none; font-family:inherit;
      background:var(--card); color:var(--text);
    }
    .field input:focus, .field textarea:focus, .field select:focus { border-color:var(--accent); }
    .field textarea { resize:vertical; min-height:90px; }

    /* ── Visibility toggle ── */
    .visibility-toggle {
      display:flex; align-items:center; gap:12px; padding:12px 14px;
      border:1.5px solid var(--border); border-radius:9px; cursor:pointer;
    }
    .toggle-track { width:40px; height:22px; border-radius:11px;
                    background:var(--border); position:relative; transition:.2s; flex-shrink:0; }
    .toggle-track.on { background:var(--accent); }
    .toggle-thumb { width:18px; height:18px; border-radius:50%; background:#fff;
                    position:absolute; top:2px; left:2px; transition:.2s; box-shadow:0 1px 4px rgba(0,0,0,.2); }
    .toggle-track.on .toggle-thumb { left:20px; }

    /* ── Photos ── */
    .photos-grid { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
    .photo-item { position:relative; width:90px; height:90px; border-radius:8px;
                  overflow:hidden; border:1.5px solid var(--border); }
    .photo-item img { width:100%; height:100%; object-fit:cover; display:block; }
    .photo-del {
      position:absolute; top:3px; right:3px; background:rgba(0,0,0,.6);
      border:none; color:#fff; width:22px; height:22px; border-radius:50%;
      cursor:pointer; font-size:14px; line-height:1; display:flex;
      align-items:center; justify-content:center;
    }
    .photo-del:hover { background:var(--danger); }
    .add-photo-row { display:flex; gap:8px; margin-bottom:8px; }
    .add-photo-row input { flex:1; padding:9px 12px; border:1.5px solid var(--border);
      border-radius:9px; font-size:13px; outline:none; }
    .add-photo-row input:focus { border-color:var(--accent); }
    .upload-row { display:flex; gap:8px; align-items:center; margin-top:4px; }
    .upload-label { display:inline-flex; align-items:center; gap:6px; padding:7px 14px;
      background:var(--bg); border:1.5px solid var(--border); border-radius:9px;
      cursor:pointer; font-size:13px; color:var(--hint); }
    .upload-label:hover { border-color:var(--accent); color:var(--accent); }
    #photo-file-input { display:none; }
    #upload-status { font-size:12px; color:var(--hint); }

    /* ── Colors ── */
    .colors-grid { display:flex; flex-wrap:wrap; gap:14px; margin-bottom:16px; }
    .color-item { display:flex; flex-direction:column; align-items:center; gap:5px;
                  position:relative; }
    .color-swatch-admin { width:52px; height:52px; border-radius:50%;
                          border:2px solid rgba(0,0,0,.1); flex-shrink:0; }
    .color-info { font-size:11px; color:var(--hint); text-align:center;
                  max-width:70px; line-height:1.3; }
    .color-del { position:absolute; top:-4px; right:-4px;
      background:var(--danger); color:#fff; border:none;
      width:18px; height:18px; border-radius:50%; cursor:pointer;
      font-size:12px; display:flex; align-items:center; justify-content:center; }
    .add-color-form { border:1.5px dashed var(--border); border-radius:10px; padding:14px; }
    .color-preview-swatch { width:32px; height:32px; border-radius:50%;
      border:2px solid rgba(0,0,0,.1); flex-shrink:0; align-self:flex-end; margin-bottom:9px; }

    /* ── Categories tab ── */
    .cat-list { background:var(--card); border-radius:12px; border:1px solid var(--border); overflow:hidden; }
    .cat-item { display:flex; align-items:center; gap:12px; padding:14px 18px;
                border-bottom:1px solid var(--border); }
    .cat-item:last-child { border-bottom:none; }
    .cat-id   { color:var(--hint); font-size:12px; min-width:28px; }
    .cat-name { flex:1; font-size:15px; }
    .cat-actions { display:flex; gap:8px; }
    .add-cat-form { background:var(--card); border-radius:12px; border:1px solid var(--border);
                    padding:20px; margin-top:20px; display:flex; gap:12px; align-items:flex-end; }
    .add-cat-form .field { flex:1; }
    .add-cat-form .field label { font-size:12px; color:var(--hint); display:block; margin-bottom:5px; }
    .add-cat-form .field input { width:100%; padding:9px 12px; border:1.5px solid var(--border);
                                  border-radius:9px; font-size:14px; outline:none; }
    .add-cat-form .field input:focus { border-color:var(--accent); }

    /* ── Loading/empty ── */
    .loading { text-align:center; padding:60px; color:var(--hint); }
    .empty   { text-align:center; padding:60px; color:var(--hint); font-size:15px; }

    @media(max-width:640px){
      header { padding:0 12px; gap:8px; }
      .nav-btn { padding:5px 8px; font-size:11px; }
      main { padding:12px; }
      .field-grid { grid-template-columns:1fr; }
      .field-grid.cols-3 { grid-template-columns:1fr 1fr; }
      table.ft th:nth-child(3), table.ft td:nth-child(3) { display:none; }
    }
  </style>
</head>
<body>

<!-- ══ LOGIN ══════════════════════════════════════════════════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-title">100FF VL</div>
    <div class="login-sub">Панель управления каталогом</div>
    <div class="login-error" id="login-error">Неверный пароль</div>
    <input type="password" id="login-input" placeholder="Пароль" autofocus>
    <button class="btn btn-primary" style="width:100%" id="login-btn">Войти</button>
  </div>
</div>

<!-- ══ APP ════════════════════════════════════════════════════════ -->
<div id="app-screen">
  <header>
    <div class="header-logo">100FF VL Admin</div>
    <nav>
      <button class="nav-btn active" data-tab="orders">Заявки</button>
      <button class="nav-btn" data-tab="samples">Образцы</button>
      <button class="nav-btn" data-tab="fabrics">Каталог</button>
      <button class="nav-btn" data-tab="categories">Категории</button>
      <button class="nav-btn" data-tab="analytics">Аналитика</button>
    </nav>
    <button class="logout-btn" id="logout-btn">Выйти</button>
  </header>

  <main>
    <!-- Заявки -->
    <div class="tab-content active" id="tab-orders">
      <div class="stats" id="orders-stats"></div>
      <div class="toolbar">
        <input type="text" id="orders-search" placeholder="Поиск по имени, телефону, номеру...">
        <label><input type="checkbox" id="orders-hide-processed"> Скрыть обработанные</label>
      </div>
      <div id="orders-list"><div class="loading">Загрузка...</div></div>
    </div>

    <!-- Образцы -->
    <div class="tab-content" id="tab-samples">
      <div class="stats" id="samples-stats"></div>
      <div class="toolbar">
        <div style="flex:1"></div>
        <label><input type="checkbox" id="samples-hide-processed"> Скрыть обработанные</label>
      </div>
      <div id="samples-list"><div class="loading">Загрузка...</div></div>
    </div>

    <!-- Каталог -->
    <div class="tab-content" id="tab-fabrics">
      <div class="toolbar">
        <input type="text" id="fabrics-search" placeholder="Поиск по названию или артикулу...">
        <button class="btn btn-primary btn-sm" onclick="openCreateEditor()">+ Добавить ткань</button>
      </div>
      <div class="fabrics-wrap">
        <div id="fabrics-table-wrap"><div class="loading">Загрузка...</div></div>
      </div>
    </div>

    <!-- Категории -->
    <div class="tab-content" id="tab-categories">
      <div id="categories-list"><div class="loading">Загрузка...</div></div>
      <div class="add-cat-form">
        <div class="field">
          <label>Название новой категории</label>
          <input type="text" id="new-cat-name" placeholder="Хлопок, Лён, Трикотаж...">
        </div>
        <button class="btn btn-primary btn-sm" onclick="addCategory()">Добавить</button>
      </div>
    </div>

    <!-- Аналитика -->
    <div class="tab-content" id="tab-analytics">
      <div id="analytics-content"><div class="loading">Загрузка...</div></div>
    </div>
  </main>
</div>

<!-- ══ МОДАЛЬНЫЙ РЕДАКТОР КАРТОЧКИ ════════════════════════════════ -->
<div class="modal-overlay" id="fabric-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-fabric-title">Редактирование ткани</div>
      <button class="modal-close" id="modal-close-btn">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" id="modal-cancel-btn">Отмена</button>
      <button class="btn btn-primary btn-sm" id="modal-save-btn">Сохранить изменения</button>
    </div>
  </div>
</div>

<script>
'use strict';

const API = '/api/admin';
let _token = '', _orders = [], _samples = [], _fabrics = [], _categories = [];
let _editFabric = null;
let _editMode = 'edit'; // 'edit' | 'create'

// ════════════════════════════════════════════════════════
// ВХОД
// ════════════════════════════════════════════════════════
document.getElementById('login-btn').addEventListener('click', tryLogin);
document.getElementById('login-input').addEventListener('keydown', e => { if (e.key==='Enter') tryLogin(); });

async function tryLogin() {
  const pwd = document.getElementById('login-input').value.trim();
  if (!pwd) return;
  const res = await fetch(`${API}/orders`, { headers: { Authorization: `Bearer ${pwd}` } });
  if (res.status === 401) { document.getElementById('login-error').style.display = 'block'; return; }
  _token = pwd;
  sessionStorage.setItem('admin_token', pwd);
  _orders = await res.json();
  showApp();
}

window.addEventListener('DOMContentLoaded', async () => {
  const saved = sessionStorage.getItem('admin_token');
  if (!saved) return;
  const res = await fetch(`${API}/orders`, { headers: { Authorization: `Bearer ${saved}` } });
  if (res.ok) { _token = saved; _orders = await res.json(); showApp(); }
});

document.getElementById('logout-btn').addEventListener('click', () => {
  sessionStorage.removeItem('admin_token'); location.reload();
});

// ════════════════════════════════════════════════════════
// ПОКАЗ ПРИЛОЖЕНИЯ
// ════════════════════════════════════════════════════════
async function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  renderOrders();
  const [sr, fr, cr] = await Promise.all([
    fetch(`${API}/samples`,    { headers: { Authorization: `Bearer ${_token}` } }),
    fetch(`${API}/fabrics`,    { headers: { Authorization: `Bearer ${_token}` } }),
    fetch(`${API}/categories`, { headers: { Authorization: `Bearer ${_token}` } }),
  ]);
  _samples    = await sr.json();
  _fabrics    = await fr.json();
  _categories = await cr.json();
  renderSamples();
  renderFabrics();
  renderCategories();
}

// ════════════════════════════════════════════════════════
// НАВИГАЦИЯ
// ════════════════════════════════════════════════════════
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'analytics') loadAnalytics();
  });
});

// ════════════════════════════════════════════════════════
// ЗАЯВКИ
// ════════════════════════════════════════════════════════
function renderOrders(filter) {
  filter = filter || '';
  const q        = filter.toLowerCase();
  const hideProc = document.getElementById('orders-hide-processed').checked;
  const list     = document.getElementById('orders-list');

  let filtered = q
    ? _orders.filter(o =>
        (o.order_number||'').toLowerCase().includes(q) ||
        (o.first_name||'').toLowerCase().includes(q) ||
        (o.phone||'').includes(q))
    : _orders.slice();
  if (hideProc) filtered = filtered.filter(o => !o.processed);

  const newCount = _orders.filter(o => !o.processed).length;
  const totalUsd = _orders.reduce((s, o) => s + parseFloat(o.total_usd || 0), 0);
  document.getElementById('orders-stats').innerHTML =
    stat(_orders.length, 'Всего заявок') +
    stat(newCount, 'Не обработано') +
    stat(totalUsd.toFixed(0) + '&nbsp;уе', 'Общая сумма');

  if (!filtered.length) { list.innerHTML = '<div class="empty">Заявок нет</div>'; return; }

  list.innerHTML = filtered.map(o => {
    const dt   = fmtDate(o.created_at);
    const user = o.tg_username ? `${o.first_name||''} @${o.tg_username}` : (o.first_name || 'Аноним');
    const rows = (o.items||[]).map(i => `<tr>
      <td>${esc(i.fabric_name)}</td><td>${esc(i.color_name)}</td>
      <td>${i.meters}&nbsp;м</td>
      <td>${parseFloat(i.price_per_meter).toFixed(2)}&nbsp;$/м</td>
      <td><span class="price-type-${i.price_type}">${i.price_type==='cut'?'отрез':'опт'}</span></td>
    </tr>`).join('');
    const statusBadge = o.processed
      ? '<span class="badge badge-done">✓ Обработано</span>'
      : '<span class="badge badge-warn">Новая</span>';
    const tgBadge = o.notified ? '' : '<span class="badge badge-warn" title="TG не доставлено">⚠ TG</span>';
    return `<div class="card${o.processed?' processed-card':''}" id="order-card-${o.id}">
      <div class="card-header">
        <div><div class="card-num">${o.order_number}</div><div class="card-date">${dt}</div></div>

function renderFabrics(filter) {

      <td><strong>${esc(f.name)}</strong><br><span class="price-tag">${esc(f.article||'')}</span></td>

function renderCategories() {
  const el = document.getElementById('categories-list');
  if (!_categories.length) { el.innerHTML = '<div class="empty">Категорий нет</div>'; return; }
  el.innerHTML = `<div class="cat-list">${_categories.map(c => `
    <div class="cat-item" id="cat-${c.id}">
      <span class="cat-id">#${c.id}</span>
      <span class="cat-name">${esc(c.name)}</span>
      <div class="cat-actions">
        <button class="btn btn-ghost btn-sm" onclick="renameCategory(${c.id})">✏ Переименовать</button>
        <button class="btn btn-danger btn-sm" onclick="deleteCategory(${c.id})">Удалить</button>
      </div>
    </div>`).join('')}</div>`;
}

async function addCategory() {
  const input = document.getElementById('new-cat-name');
  const name  = input.value.trim();
  if (!name) return;
  const res = await fetch(`${API}/categories`, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', Authorization:`Bearer ${_token}` },
    body: JSON.stringify({ name }),
  });
  if (res.ok) {
    const cat = await res.json();
    _categories.push(cat);
    input.value = '';
    renderCategories();
  } else {
    alert('Ошибка при добавлении категории');
  }
}

async function renameCategory(id) {
  const cat = _categories.find(c => c.id === id);
  const newName = prompt('Новое название:', cat ? cat.name : '');
  if (!newName || !newName.trim()) return;
  const res = await fetch(`${API}/categories?id=${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type':'application/json', Authorization:`Bearer ${_token}` },
    body: JSON.stringify({ name: newName.trim() }),
  });
  if (res.ok) {
    if (cat) cat.name = newName.trim();
    renderCategories();
  } else {
    alert('Ошибка при переименовании');
  }
}

async function deleteCategory(id) {
  if (!confirm('Удалить категорию? Ткани этой категории останутся без категории.')) return;
  const res = await fetch(`${API}/categories?id=${id}`, {
    method: 'DELETE', headers: { Authorization:`Bearer ${_token}` }
  });
  if (res.ok) {
    _categories = _categories.filter(c => c.id !== id);
    renderCategories();
  } else {
    alert('Ошибка при удалении');
  }
}

// ── Сохранить / Создать ────────────────────────────────
document.getElementById('modal-save-btn').addEventListener('click', async () => {
  const btn = document.getElementById('modal-save-btn');
  btn.disabled = true; btn.textContent = '...';

  const fields = {
    name:        (document.getElementById('e-name')?.value || '').trim(),
    article:     document.getElementById('e-article')?.value || '',
    composition: document.getElementById('e-composition')?.value || '',
    category_id: document.getElementById('e-category-id')?.value || null,
    width:       document.getElementById('e-width')?.value || null,
    density:     document.getElementById('e-density')?.value || null,
    min_order:   document.getElementById('e-min-order')?.value || null,
    unit:        document.querySelector('input[name="e-unit"]:checked')?.value || 'м',
    base_price:  document.getElementById('e-base-price')?.value || 0,
    cut_price:   document.getElementById('e-cut-price')?.value || null,
    description: document.getElementById('e-description')?.value || '',
    is_active:   _editFabric.is_active,
  };

  if (!fields.name) {
    alert('Введите название ткани');
    btn.disabled = false;
    btn.textContent = _editMode === 'create' ? 'Создать ткань' : 'Сохранить изменения';
    return;
  }

  if (_editMode === 'create') {
    const res = await fetch(`${API}/fabrics`, {
      method: 'PUT',
      headers: { 'Content-Type':'application/json', Authorization:`Bearer ${_token}` },
      body: JSON.stringify(fields),
    });
    if (res.ok) {
      const newFabric = await res.json();
      _fabrics.unshift(newFabric);
      renderFabrics(document.getElementById('fabrics-search').value);
      closeModal();
      setTimeout(() => openEditor(newFabric.id), 150);
    } else {
      btn.textContent = '✗ Ошибка';
      btn.disabled = false;
      setTimeout(() => { btn.textContent = 'Создать ткань'; }, 1500);
    }
  } else {
    const res = await fetch(`${API}/fabrics`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', Authorization:`Bearer ${_token}` },
      body: JSON.stringify({ id: _editFabric.id, ...fields }),
    });
    btn.disabled = false;
    if (res.ok) {
      btn.textContent = '✓ Сохранено';
      const idx = _fabrics.findIndex(f => f.id === _editFabric.id);
      if (idx >= 0) Object.assign(_fabrics[idx], fields, { categories: _fabrics[idx].categories });
      renderFabrics(document.getElementById('fabrics-search').value);
      setTimeout(() => { btn.textContent = 'Сохранить изменения'; }, 1500);
    } else {
      btn.textContent = '✗ Ошибка';
      setTimeout(() => { btn.textContent = 'Сохранить изменения'; }, 1500);
    }
  }
});

// ── Фото: добавить по URL ─────────────────────────────
async function addPhotoByUrl() {
  const url = document.getElementById('new-photo-url').value.trim();
  if (!url) return;
  const res = await fetch(`${API}/photos`, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', Authorization:`Bearer ${_token}` },
    body: JSON.stringify({ fabric_id: _editFabric.id, url, sort_order: (_editFabric.photos||[]).length }),
  });
  if (res.ok) {
    const photo = await res.json();
    _editFabric.photos = [...(_editFabric.photos||[]), photo];
    document.getElementById('photos-grid').innerHTML = renderPhotosGrid();
    document.getElementById('new-photo-url').value = '';
  } else {
    alert('Ошибка при добавлении фото');
  }
}

// ── Фото: загрузить файл ──────────────────────────────
async function addPhotoByFile() {
  const input  = document.getElementById('photo-file-input');
  const status = document.getElementById('upload-status');
  const file   = input.files[0];
  if (!file) return;

  status.textContent = 'Загружаю...';
  try {
    const base64 = await fileToBase64(file);
    const r1 = await fetch(`${API}/upload`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', Authorization:`Bearer ${_token}` },
      body: JSON.stringify({ filename: file.name, base64, contentType: file.type }),
    });
    if (!r1.ok) { const e = await r1.json(); throw new Error(e.error || r1.status); }
    const { url } = await r1.json();

    status.textContent = 'Сохраняю...';
    const r2 = await fetch(`${API}/photos`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', Authorization:`Bearer ${_token}` },
      body: JSON.stringify({ fabric_id: _editFabric.id, url, sort_order: (_editFabric.photos||[]).length }),
    });
    if (r2.ok) {
      const photo = await r2.json();
      _editFabric.photos = [...(_editFabric.photos||[]), photo];
      document.getElementById('photos-grid').innerHTML = renderPhotosGrid();
      status.textContent = '✓ Загружено';
    } else {
      status.textContent = '✗ Ошибка сохранения';
    }
  } catch(e) {
    status.textContent = '✗ ' + e.message;
  }
  input.value = '';
  setTimeout(() => { status.textContent = ''; }, 3000);
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload  = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ── Фото: удалить ────────────────────────────────────
async function deletePhoto(id) {
  if (!confirm('Удалить это фото?')) return;
  const res = await fetch(`${API}/photos?id=${id}`, {
    method: 'DELETE', headers: { Authorization:`Bearer ${_token}` }
  });
  if (res.ok) {
    _editFabric.photos = _editFabric.photos.filter(p => p.id !== id);
    document.getElementById('photos-grid').innerHTML = renderPhotosGrid();
  }
}

// ── Цвет: добавить ───────────────────────────────────
async function addColor() {
  const hex  = document.getElementById('new-color-hex').value;
  const name = document.getElementById('new-color-name').value.trim();
  if (!name) { alert('Введите название цвета'); return; }
  const res = await fetch(`${API}/colors`, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', Authorization:`Bearer ${_token}` },
    body: JSON.stringify({ fabric_id: _editFabric.id, hex, name }),
  });
  if (res.ok) {
    const color = await res.json();
    _editFabric.colors = [...(_editFabric.colors||[]), color];
    document.getElementById('colors-grid').innerHTML = renderColorsGrid();
    document.getElementById('new-color-name').value = '';
  } else {
    alert('Ошибка при добавлении цвета');
  }
}

// ── Цвет: удалить ────────────────────────────────────
async function deleteColor(id) {
  if (!confirm('Удалить этот цвет?')) return;
  const res = await fetch(`${API}/colors?id=${id}`, {
    method: 'DELETE', headers: { Authorization:`Bearer ${_token}` }
  });
  if (res.ok) {
    _editFabric.colors = _editFabric.colors.filter(c => c.id !== id);
    document.getElementById('colors-grid').innerHTML = renderColorsGrid();
  }
}

// ── Закрытие модала ──────────────────────────────────
document.getElementById('modal-close-btn').addEventListener('click', closeModal);
document.getElementById('modal-cancel-btn').addEventListener('click', closeModal);
document.getElementById('fabric-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('fabric-modal')) closeModal();
});
function closeModal() {
  document.getElementById('fabric-modal').classList.remove('open');
  _editFabric = null;
  _editMode = 'edit';
}

// ════════════════════════════════════════════════════════
// АНАЛИТИКА
// ════════════════════════════════════════════════════════
async function loadAnalytics() {
  const el = document.getElementById('analytics-content');
  el.innerHTML = '<div class="loading">Загрузка...</div>';
  try {
    const res = await fetch(`/api/analytics`, { headers: { Authorization: `Bearer ${_token}` } });
    if (!res.ok) throw new Error(res.status);
    const d = await res.json();
    el.innerHTML = renderAnalytics(d);
  } catch (err) {
    el.innerHTML = `<div class="empty">Ошибка загрузки аналитики: ${err.message}</div>`;
  }
}

function renderAnalytics(d) {
  const topRows = d.topFabrics.map((f, i) => `
    <tr>
      <td>${i + 1}</td>
      <td>${esc(f.name)}</td>
      <td style="color:var(--hint);font-size:12px">${esc(f.article)}</td>
      <td><strong>${f.views}</strong></td>
    </tr>`).join('');

  const chartMax = Math.max(...d.ordersByDay.map(o => o.count), 1);
  const chartBars = d.ordersByDay.map(o => {
    const h = Math.round((o.count / chartMax) * 80);
    const label = o.date.slice(5); // MM-DD
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:28px">
      <div style="font-size:11px;color:var(--hint)">${o.count}</div>
      <div style="background:var(--accent);width:100%;height:${h}px;border-radius:3px 3px 0 0;min-height:2px"></div>
      <div style="font-size:10px;color:var(--hint);transform:rotate(-45deg);transform-origin:top left;margin-top:6px;white-space:nowrap">${label}</div>
    </div>`;
  }).join('');

  return `
    <div class="stats" style="margin-bottom:20px">
      ${stat(d.totalOrders,   'Всего заявок')}
      ${stat(d.totalSamples,  'Запросов образцов')}
      ${stat(d.totalUsers,    'Пользователей')}
      ${stat(d.newUsersMonth, 'Новых за 30 дней')}
      ${stat(d.totalViews30d, 'Просмотров за 30 дней')}
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">

      <!-- Топ тканей -->
      <div class="fabrics-wrap" style="border-radius:12px">
        <div style="padding:16px 18px;font-weight:600;border-bottom:1px solid var(--border)">
          Топ-10 тканей за 30 дней
        </div>
        ${d.topFabrics.length ? `
        <table class="ft">
          <thead><tr>
            <th>#</th><th>Ткань</th><th>Артикул</th><th>Просмотры</th>
          </tr></thead>
          <tbody>${topRows}</tbody>
        </table>` : '<div class="empty" style="padding:30px">Нет данных — просмотры ещё не записывались</div>'}
      </div>

      <!-- График заявок -->
      <div class="fabrics-wrap" style="border-radius:12px">
        <div style="padding:16px 18px;font-weight:600;border-bottom:1px solid var(--border)">
          Заявки по дням (30 дней)
        </div>
        ${d.ordersByDay.length ? `
        <div style="padding:20px 16px 32px">
          <div style="display:flex;align-items:flex-end;gap:4px;height:100px">
            ${chartBars}
          </div>
        </div>` : '<div class="empty" style="padding:30px">Заявок пока нет</div>'}
      </div>

    </div>`;
}

// ════════════════════════════════════════════════════════
// УТИЛИТЫ
// ════════════════════════════════════════════════════════
function stat(val, label) {
  return `<div class="stat-card"><div class="stat-val">${val}</div><div class="stat-label">${label}</div></div>`;
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(iso) {
  return new Date(iso).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
</script>
