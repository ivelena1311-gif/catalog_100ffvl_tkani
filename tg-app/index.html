<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!--
    viewport: maximum-scale=1, user-scalable=no — отключаем зум страницы,
    так как зум будет только в галерее товара
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Ткани оптом — 100FF</title>

  <!-- Preconnect для быстрой загрузки шрифтов Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Telegram Mini App SDK — обязателен для работы в Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Стили приложения -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ============================================================
       ЭКРАН 1: КАТАЛОГ (корневой, открывается первым)
       ============================================================ -->
  <div id="screen-catalog" class="screen active" role="main">

    <!-- Шапка -->
    <header class="screen-header catalog-header">
      <div class="catalog-header-brand">
        <img src="logo.jpg" alt="100FF VL" class="catalog-logo">
        <span class="catalog-header-title">Ткани оптом 100FF VL</span>
      </div>
      <button class="icon-btn" id="catalog-filter-btn" title="Фильтры" aria-label="Открыть фильтры">
        &#9776;
      </button>
    </header>

    <!-- Баннеры (акции / новинки) -->
    <div class="catalog-banners" id="catalog-banners"></div>

    <!-- Горизонтальный скролл категорий -->
    <div class="categories-bar" id="categories-bar" role="tablist"></div>

    <!-- Счётчик результатов -->
    <div class="catalog-count" id="catalog-count"></div>

    <!-- Сетка карточек -->
    <div class="catalog-grid" id="catalog-grid"></div>

  </div>

  <!-- ============================================================
       ЭКРАН 2: КАРТОЧКА ТОВАРА
       ============================================================ -->
  <div id="screen-product" class="screen" role="main">

    <!-- Галерея: слайды заполняются динамически -->
    <div class="product-gallery" id="product-gallery">
      <div class="gallery-slides" id="gallery-slides"></div>
      <div class="gallery-dots" id="gallery-dots"></div>

      <!-- Кнопка "Избранное" поверх галереи -->
      <button class="gallery-fav-btn" id="fav-btn" aria-label="Добавить в избранное">
        &#9825;
      </button>
    </div>

    <!-- Вся информация о товаре -->
    <div class="product-info" id="product-info"></div>

  </div>

  <!-- ============================================================
       ЭКРАН 3: ПОИСК
       ============================================================ -->
  <div id="screen-search" class="screen" role="search">

    <!-- Строка поиска -->
    <div class="search-input-wrap">
      <div class="search-input-inner">
        <span class="search-icon">&#128269;</span>
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Название, артикул, состав..."
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          enterkeyhint="search"
        >
        <button class="search-clear hidden" id="search-clear-btn" aria-label="Очистить">&#10005;</button>
      </div>
    </div>

    <!-- Контент: история или результаты -->
    <div id="search-content"></div>

  </div>

  <!-- ============================================================
       ЭКРАН 4: КОРЗИНА / ЗАЯВКА
       ============================================================ -->
  <div id="screen-cart" class="screen" role="main">

    <header class="screen-header">
      <span class="screen-title">Моя заявка</span>
      <span class="screen-title-count" id="cart-header-count" style="font-size:14px;color:var(--tg-hint);font-weight:400"></span>
    </header>

    <div id="cart-content"></div>

  </div>

  <!-- ============================================================
       ЭКРАН 5: ОФОРМЛЕНИЕ ЗАЯВКИ
       ============================================================ -->
  <div id="screen-checkout" class="screen no-tabbar" role="form">

    <header class="screen-header">
      <span class="screen-title">Оформление заявки</span>
    </header>

    <form class="checkout-form" id="checkout-form" novalidate>

      <div>
        <div class="form-section-title">Контактные данные</div>
        <div class="form-group">
          <div class="form-field">
            <label class="form-field-label" for="field-name">Имя и фамилия *</label>
            <input
              type="text"
              id="field-name"
              name="name"
              placeholder="Иван Петров"
              autocomplete="name"
              required
            >
          </div>
          <div class="form-field">
            <label class="form-field-label" for="field-phone">Телефон *</label>
            <input
              type="tel"
              id="field-phone"
              name="phone"
              placeholder="+7 (___) ___-__-__"
              autocomplete="tel"
              required
            >
          </div>
          <div class="form-field">
            <label class="form-field-label" for="field-company">Название компании</label>
            <input
              type="text"
              id="field-company"
              name="company"
              placeholder="ООО &laquo;Текстиль&raquo;"
              autocomplete="organization"
            >
          </div>
        </div>
      </div>

      <div>
        <div class="form-section-title">Комментарий к заявке</div>
        <div class="form-group">
          <div class="form-field">
            <textarea
              id="field-comment"
              name="comment"
              placeholder="Срочная доставка, самовывоз, особые пожелания..."
              rows="3"
            ></textarea>
          </div>
        </div>
      </div>

      <!-- Сводка заявки (заполняется динамически) -->
      <div>
        <div class="form-section-title">Состав заявки</div>
        <div class="checkout-summary" id="checkout-summary"></div>
      </div>

    </form>

  </div>

  <!-- ============================================================
       ЭКРАН 6: УСПЕШНАЯ ОТПРАВКА
       ============================================================ -->
  <div id="screen-success" class="screen no-tabbar" role="main">
    <div class="success-screen" id="success-content"></div>
  </div>

  <!-- ============================================================
       ЭКРАН 7: ПРОФИЛЬ
       ============================================================ -->
  <div id="screen-profile" class="screen" role="main">

    <header class="screen-header">
      <span class="screen-title">Профиль</span>
    </header>

    <div class="profile-content" id="profile-content"></div>

  </div>

  <!-- ============================================================
       ЭКРАН: ИЗБРАННОЕ
       ============================================================ -->
  <div id="screen-favorites" class="screen" role="main">

    <header class="screen-header">
      <span class="screen-title">Избранное</span>
    </header>

    <div id="favorites-content"></div>

  </div>

  <!-- ============================================================
       TAB BAR (нижняя навигация)
       ============================================================ -->
  <nav id="tab-bar" role="navigation" aria-label="Навигация">

    <!-- Каталог — ножницы (тема ткани) -->
    <button class="tab-item active" data-screen="catalog" aria-label="Каталог">
      <span class="tab-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="2.5"/>
          <circle cx="6" cy="18" r="2.5"/>
          <line x1="20" y1="4" x2="8.12" y2="15.88"/>
          <line x1="14.47" y1="14.48" x2="20" y2="20"/>
          <line x1="8.12" y1="8.12" x2="12" y2="12"/>
        </svg>
      </span>
      <span class="tab-label">Каталог</span>
    </button>

    <!-- Поиск — лупа -->
    <button class="tab-item" data-screen="search" aria-label="Поиск">
      <span class="tab-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
      </span>
      <span class="tab-label">Поиск</span>
    </button>

    <!-- Заявка — буфер обмена с линиями -->
    <button class="tab-item" data-screen="cart" aria-label="Заявка" style="position:relative">
      <span class="tab-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="3" rx="1"/>
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
          <line x1="9" y1="12" x2="15" y2="12"/>
          <line x1="9" y1="16" x2="13" y2="16"/>
        </svg>
      </span>
      <span class="tab-label">Заявка</span>
      <span class="tab-badge hidden" id="cart-badge">0</span>
    </button>

    <!-- Избранное — сердце -->
    <button class="tab-item" data-screen="favorites" aria-label="Избранное" style="position:relative">
      <span class="tab-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </span>
      <span class="tab-label">Избранное</span>
      <span class="tab-badge hidden" id="fav-badge">0</span>
    </button>

    <!-- Профиль — силуэт человека -->
    <button class="tab-item" data-screen="profile" aria-label="Профиль">
      <span class="tab-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </span>
      <span class="tab-label">Профиль</span>
    </button>

  </nav>

  <!-- ============================================================
       BOTTOM SHEET: ФИЛЬТРЫ
       ============================================================ -->
  <div id="sheet-filters" class="bottom-sheet" role="dialog" aria-label="Фильтры">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <span class="sheet-title">Фильтры</span>
      <button class="sheet-reset" id="filters-reset-btn">Сбросить</button>
    </div>
    <div class="filters-content" id="filters-content"></div>
    <!-- MainButton показывается через TG SDK или fallback-кнопка -->
    <div style="padding:0 16px 16px" id="filters-apply-wrap"></div>
  </div>

  <!-- ============================================================
       BOTTOM SHEET: ЗАПРОС ОБРАЗЦА
       ============================================================ -->
  <div id="sheet-sample" class="bottom-sheet" role="dialog" aria-label="Запрос образца">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <span class="sheet-title">Запросить образец</span>
    </div>
    <div id="sheet-sample-content" style="padding:0 16px 16px"></div>
  </div>

  <!-- ============================================================
       OVERLAY (затемнение под bottom sheet)
       ============================================================ -->
  <div id="overlay"></div>

  <!-- ============================================================
       TOAST-УВЕДОМЛЕНИЕ
       ============================================================ -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- ============================================================
       WELCOME-ЭКРАН (показывается при первом открытии)
       ============================================================ -->
  <div id="welcome-modal" class="welcome-modal" role="dialog" aria-modal="true" aria-label="Добро пожаловать">
    <div class="welcome-backdrop"></div>
    <div class="welcome-card">
      <div class="welcome-emoji">🧵</div>
      <div class="welcome-greeting" id="welcome-greeting"></div>
      <h1 class="welcome-title">Каталог тканей 100FF VL</h1>
      <p class="welcome-subtitle">Здесь вы можете:</p>
      <ul class="welcome-bullets">
        <li>Посмотреть актуальные ткани</li>
        <li>Подобрать материалы для коллекции</li>
        <li>Отправить запрос на заказ</li>
      </ul>
      <button class="welcome-btn" id="welcome-open-btn">Открыть каталог</button>
      <button class="welcome-skip" id="welcome-skip-btn">Пропустить</button>
    </div>
  </div>

</div><!-- /app -->

<!-- Статические данные, вспомогательные функции -->
<script src="js/data.js"></script>
<!-- API-клиент: загрузка каталога из Supabase через Vercel Functions -->
<script src="js/api.js"></script>
<!-- Состояние приложения (корзина, фильтры, избранное) -->
<script src="js/store.js"></script>
<!-- Основная логика и роутер -->
<script src="js/app.js"></script>

</body>
</html>
